<!DOCTYPE html>
<html lang="de">
<head>
    <title>Weed Pause Timer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Home.css">
</head>
<body>
    <div id="navi">
        <a href="Home.html">Home</a>
        <a href="Info.html">Info</a>
        <a href="Archivments.html">Archivments</a>
        <a href="Statistik.html">Statistik</a>
    </div>
    <div id ="mainContent">
        <button onclick="pause()" id="pauseBtn">Pause !</button>
        <button onclick="schwach()" id="schwachBtn">Schwach geworden..</button>
        <div class="video-wrap">
            <video id="weedLogo" src="images/bud.webm" loop autoplay muted></video>
        </div>
        <input type="date" id="kalender"> 
        <button onclick="dateSubmit()">Datum übernehmen</button>

            <span id="date"></span> <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>
        </div>
    </div>
