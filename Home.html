<!DOCTYPE html>
<html lang="de">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Home.css">
    <title>Weed Pause Timer</title>
</head>
<body>
    <app-nav class="navi" role="navigation" op-menu aria-label="Main Navigation" opnav tabindex="0">
        <div role="presentation">
            <ul class="naviSection">
                <li><a href="Home.html">Home</a></li>
                <li><a href="Info.html">Info</a></li>
                <li><a href="Archivments.html">Archivments</a></li>
                <li><a href="Statistic.html">Statistic</a></li>
            </ul>
        </div>
    </app-nav>
    <main id ="mainContent">
        <div class="video-wrap">
            <video class="weedLogo" src="images/bud.webm" loop autoplay muted></video>
        </div>
        <button onclick="pause()" id="pauseBtn" class="start button">Start pause !</button>
        <button onclick="schwach()" id="schwachBtn" class="weak button">U got WEAK!</button>
        <input type="date" id="kalender" class="button"> 
        <button onclick="dateSubmit()" class="accept button">Accept date</button>
        <div id="timer">
            <span id="seconds" class="timer">00 SEC</span> <span id="minutes" class="timer">00 MIN</span> <span id="hours" class="timer">00 H</span> <span class="timer">00 D</span> <span class="timer">00 M</span> <span class="timer">00 Y</span> <span id="date"></span> 
        </div>
    </main>
    <script src="Home.js"></script>
</body>
